events {}

http {
    server {
        listen 80;
        server_name localhost;

        # Serve the frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Forward API requests to Node.js
        location /api/ {
            proxy_pass http://backend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}